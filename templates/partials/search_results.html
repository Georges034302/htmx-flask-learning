{% if employees %}

<p>
	<strong>{{ employees|length }}</strong>
	employee{% if employees|length != 1 %}s{% endif %} found.
</p>

<ul>
{% for employee in employees %}
	<li>
		{{ employee.name }} - {{ employee.department }}
	</li>
{% endfor %}
</ul>

{% else %}

<p>No employees found.</p>

{% endif %}
