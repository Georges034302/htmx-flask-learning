<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>HTMX Learning</title>

	<!-- HTMX CDN -->
	<script src="https://unpkg.com/htmx.org@1.9.12"></script>

	<!-- App Stylesheet -->
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

	<div
		id="messages"
		hx-get="/messages"
		hx-trigger="load, refresh-messages from:body"
		hx-target="this">
	</div>

	<div class="top-bar">
		<h1>HTMX + Flask</h1>
		<a href="/logout"><button type="button">Logout</button></a>
	</div>

	<div class="hello-row">
		<button
			hx-get="/hello-toggle"
			hx-target="#result">
			Click Me
		</button>
		<div id="result" class="hello-result"></div>
	</div>
	
	<hr>

	<h2>Live Search Demo</h2>

	<input
		type="text"
		name="query"
		placeholder="Search employees..."
		hx-get="/employees"
		hx-trigger="keyup changed delay:500ms"
		hx-target="#employee-table-container"
		hx-indicator="#loading"
		hx-swap="innerHTML">

	<p id="loading" style="display:none;">
		Loading...
	</p>

	<hr>

	<h2>Automatic Content Loading</h2>

	<div
		hx-get="/latest"
		hx-trigger="load, employee-added from:body"
		hx-target="this">
		Loading latest updates...
	</div>

	<hr>

	<h2>Employee Table</h2>

	<div
		id="employee-table-container"
		hx-get="/employees"
		hx-trigger="load, every 5s, employee-added from:body"
		hx-target="this">
		Loading employees...
	</div>

	<hr>

	<h2>Add Employee</h2>

	<form
		id="employee-form"
		hx-post="/add-employee"
		hx-target="#form-result">
		<input
			type="text"
			name="name"
			placeholder="Employee Name"
			required>

		<input
			type="text"
			name="department"
			placeholder="Department"
			required>

		<button type="submit">
			Add Employee
		</button>
	</form>

	<div id="form-result"></div>

	<hr>

	<h2>File Upload</h2>

	<form
		hx-post="/upload-file"
		hx-target="#upload-result"
		hx-encoding="multipart/form-data">
		<input type="file" name="file" accept=".png,.jpg,.jpeg,.gif,.pdf,.txt,.csv">
		<button type="submit">Upload</button>
	</form>

	<div id="upload-result"></div>

	<div id="modal"></div>

	<script>
		document.body.addEventListener("employee-added", function () {
			document.getElementById("employee-form").reset();
		});

		document.body.addEventListener("htmx:afterSwap", function () {
			const messages = document.querySelectorAll(".auto-dismiss");
			messages.forEach(function (message) {
				setTimeout(function () {
					message.remove();
				}, 3000);
			});
		});
	</script>

</body>
</html>
